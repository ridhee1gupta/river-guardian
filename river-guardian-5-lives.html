<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>River Guardian</title>

<style>
  :root {
    --ink: #17352e;
    --cream: #fff8e7;
    --panel: rgba(255,248,231,.94);
    --green: #4f8f58;
    --green-dark: #2f6840;
    --blue: #4b97b8;
    --coral: #dd7f62;
    --shadow: 0 10px 28px rgba(21,55,47,.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #b7d6d4;
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    touch-action: none;
  }

  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 10%, rgba(255,255,255,.9), transparent 44%),
      linear-gradient(#b9dfe7, #d6ebdf);
  }

  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #b9dfe7;
    box-shadow: var(--shadow);
  }

  #hud {
    position: absolute;
    inset: max(10px, env(safe-area-inset-top)) 12px auto 12px;
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    pointer-events: none;
    font-weight: 800;
    text-shadow: 0 1px 0 rgba(255,255,255,.45);
  }

  .hud-pill {
    background: rgba(255,248,231,.9);
    border: 2px solid rgba(23,53,46,.18);
    border-radius: 999px;
    padding: 7px 11px;
    box-shadow: 0 4px 12px rgba(23,53,46,.12);
    white-space: nowrap;
  }

  #healthBox {
    min-width: 220px;
    flex: 1 1 220px;
    max-width: 340px;
  }

  #healthTrack {
    margin-top: 4px;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(23,53,46,.15);
  }

  #healthFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d69854, #6da95d, #2f7d58);
    transition: width .18s ease;
  }

  #screen {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    background: linear-gradient(rgba(76,131,145,.22), rgba(35,84,77,.22));
  }

  #screen.hidden { display: none; }

  .panel {
    width: min(700px, 94vw);
    max-height: min(86vh, 760px);
    overflow: auto;
    background: var(--panel);
    border: 2px solid rgba(23,53,46,.18);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 34px);
  }

  h1, h2, h3, p { margin-top: 0; }

  h1 {
    font-size: clamp(2.2rem, 7vw, 4.7rem);
    line-height: .92;
    margin-bottom: 10px;
    letter-spacing: -.05em;
  }

  h1 span { color: #2f7d58; }

  h2 {
    font-size: clamp(1.6rem, 4vw, 2.5rem);
    margin-bottom: 10px;
  }

  h3 { margin: 22px 0 8px; }

  p { line-height: 1.45; }

  .subtitle {
    font-size: 1.05rem;
    max-width: 54ch;
  }

  .howto {
    margin: 18px 0;
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(79,143,88,.10);
    border: 1px solid rgba(79,143,88,.2);
  }

  .howto ul {
    margin: 8px 0 0 20px;
    padding: 0;
    line-height: 1.5;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 6px;
  }

  .tag {
    background: #fff;
    border: 1px solid rgba(23,53,46,.12);
    border-radius: 999px;
    padding: 6px 9px;
    font-size: .9rem;
  }

  button {
    font: inherit;
    font-weight: 900;
    color: white;
    background: var(--green-dark);
    border: 0;
    border-radius: 16px;
    padding: 12px 18px;
    cursor: pointer;
    box-shadow: 0 5px 0 #204d30;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #204d30;
  }

  #touchControls {
    position: absolute;
    inset: auto 0 max(10px, env(safe-area-inset-bottom)) 0;
    display: none;
    justify-content: space-between;
    align-items: end;
    padding:
      0
      max(16px, env(safe-area-inset-left))
      0
      max(16px, env(safe-area-inset-right));
    pointer-events: none;
  }

  .touchCluster {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }

  .touchBtn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    user-select: none;
    -webkit-user-select: none;
    background: rgba(255,248,231,.84);
    border: 2px solid rgba(23,53,46,.2);
    color: var(--ink);
    font-size: 1.65rem;
    font-weight: 900;
    box-shadow: 0 6px 18px rgba(23,53,46,.17);
  }

  .touchBtn.active {
    transform: scale(.94);
    background: rgba(255,255,255,.98);
  }

  #jumpBtn {
    width: 78px;
    height: 78px;
    font-size: 1rem;
  }

  #toast {
    position: absolute;
    left: 50%;
    top: 84px;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(255,248,231,.94);
    border: 2px solid rgba(23,53,46,.16);
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 900;
    opacity: 0;
    transition: .2s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (pointer: coarse), (max-width: 900px) {
    #touchControls.playing { display: flex; }
    #hud { font-size: .84rem; }
    #healthBox { min-width: 165px; }
  }
</style>
</head>

<body>
<div id="gameWrap">

  <canvas id="game" width="960" height="540" aria-label="River Guardian platform game"></canvas>

  <div id="hud">
    <div class="hud-pill" id="levelLabel">Level 1</div>
    <div class="hud-pill">Score: <span id="scoreLabel">0</span></div>
    <div class="hud-pill">Lives: <span id="livesLabel">5</span></div>
    <div class="hud-pill">Seeds: <span id="seedLabel">0</span></div>
    <div class="hud-pill">Salmon eggs: <span id="eggLabel">0</span></div>

    <div class="hud-pill" id="healthBox">
      Ecosystem health:
      <span id="healthLabel">0%</span>
      <div id="healthTrack">
        <div id="healthFill"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="screen"></div>

  <div id="touchControls">
    <div class="touchCluster">
      <div class="touchBtn" data-control="left" aria-label="Move left">◀</div>
      <div class="touchBtn" data-control="right" aria-label="Move right">▶</div>
    </div>

    <div class="touchCluster">
      <div class="touchBtn" id="jumpBtn" data-control="jump" aria-label="Jump">JUMP</div>
    </div>
  </div>

</div>

      active: true
    }));
  }

    return Array.from({ length: count }, (_, i) => {
      const t = count === 1 ? 0 : i / (count - 1);
      return {
        x: x + i * spacing,
        y: y - Math.sin(t * Math.PI) * height,

    });

  function showTitle() {
    game.state = 'title';
    hud.style.display = 'none';
    touchControls.classList.remove('playing');
    screen.classList.remove('hidden');

    screen.innerHTML = `
      <div class="panel">
        <h1>River <span>Guardian</span></h1>

        <p class="subtitle">
          Travel from the Pacific coast to the mountain
          headwaters, restoring the river as you go.
        </p>

        <div class="legend">
          <span class="tag">3 river levels</span>
          <span class="tag">80% health to progress</span>
          <span class="tag">rare salmon eggs</span>
          <span class="tag">5 lives</span>
        </div>

        <div class="howto">
          <h3>How to Play</h3>
          <ul>
            <li><strong>Move:</strong> Arrow keys or the on-screen ◀ ▶ buttons.</li>
            <li><strong>Jump:</strong> Spacebar or the JUMP button.</li>
            <li>Collect <strong>native seeds</strong> and clean up <strong>litter</strong>.</li>
            <li>Jump on invasive plants from above to remove them. Avoid their sides.</li>
            <li>Avoid polluted runoff and dangerous falls.</li>
            <li>Rare <strong>salmon eggs</strong> restore salmon populations and give a large bonus.</li>
            <li>Reach the restoration marker with <strong>80% ecosystem health</strong> to complete the level.</li>
          </ul>
        </div>

        <button id="startBtn">Start the Journey</button>
      </div>
    `;

    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame() {
    game.score = 0;
    game.lives = 5;
    game.totalEggs = 0;
    game.levelIndex = 0;
    loadLevel(0);
  }

  function loadLevel(index) {
    game.levelIndex = index;
    game.level = levelBuilders[index]();
    game.seeds = 0;
    game.eggs = 0;

    game.health =
      index === 0
        ? 20
        : index === 1
          ? 16
          : 12;

    game.cameraX = 0;
    game.respawnX = game.level.start.x;
    game.respawnY = game.level.start.y;

    player.x = game.level.start.x;
    player.y = game.level.start.y;
    player.vx = 0;
    player.vy = 0;
    player.invuln = 70;
    player.grounded = false;

    game.state = 'playing';

    screen.classList.add('hidden');
    hud.style.display = 'flex';
    touchControls.classList.add('playing');

    updateHud();
    showToast(`${game.level.name} — reach 80% health`);
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    toastTimer = 150;
  }

  function updateHud() {
    labels.level.textContent =
      `Level ${game.levelIndex + 1}: ${game.level ? game.level.name : ''}`;

    labels.score.textContent = game.score;
    labels.lives.textContent = game.lives;
    labels.seeds.textContent = game.seeds;
    labels.eggs.textContent = game.eggs;
    labels.health.textContent = `${Math.round(game.health)}%`;
    labels.healthFill.style.width = `${clamp(game.health, 0, 100)}%`;
  }

  function addHealth(amount) {
    game.health = clamp(game.health + amount, 0, 100);
    updateHud();
  }

  function addScore(points) {
    game.score += points;
    updateHud();
  }

  function requestJump() {
    jumpBuffer = 10;
  }

  document.addEventListener(
    'keydown',
    (e) => {
      if (
        ['ArrowLeft', 'ArrowRight', 'ArrowUp', ' ', 'Spacebar'].includes(e.key)
      ) {
        e.preventDefault();
      }

      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;

      if (
        (e.key === ' ' || e.key === 'ArrowUp') &&
        !e.repeat
      ) {
        requestJump();
      }

      if (
        e.key === 'Enter' &&
        game.state === 'title'
      ) {
        startGame();
      }
    },
    { passive: false }
  );

  document.addEventListener(
    'keyup',
    (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    }
  );

  document.querySelectorAll('.touchBtn').forEach(btn => {
    const control = btn.dataset.control;

    const down = (e) => {
      e.preventDefault();
      btn.classList.add('active');

      if (control === 'left') keys.left = true;
      if (control === 'right') keys.right = true;
      if (control === 'jump') requestJump();

      try {
        btn.setPointerCapture(e.pointerId);
      } catch (_) {}
    };

    const up = (e) => {
      e.preventDefault();
      btn.classList.remove('active');

      if (control === 'left') keys.left = false;
      if (control === 'right') keys.right = false;
    };

    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);
  });

  function damagePlayer() {
    if (
      player.invuln > 0 ||
      game.state !== 'playing'
    ) {
      return;
    }

    game.lives--;
    updateHud();

    if (game.lives <= 0) {
      showGameOver();
      return;
    }

    player.x = game.respawnX;
    player.y = game.respawnY;
    player.vx = 0;
    player.vy = -3;
    player.invuln = 110;

    showToast('Try again — keep restoring!');
  }

  function showGameOver() {
    game.state = 'gameOver';

    hud.style.display = 'none';
    touchControls.classList.remove('playing');
    screen.classList.remove('hidden');

    screen.innerHTML = `
      <div class="panel">
        <h2>The river still needs you</h2>
        <p>Score: <strong>${game.score}</strong></p>
        <p>Salmon eggs rescued: <strong>${game.totalEggs}</strong></p>
        <button id="retryBtn">Start Again</button>
      </div>
    `;

    document.getElementById('retryBtn').addEventListener('click', startGame);
  }

  function completeLevel() {
    if (game.state !== 'playing') return;

    game.state = 'levelComplete';
    game.totalEggs += game.eggs;

    addScore(
      500 +
      Math.round(game.health) * 5 +
      game.eggs * 100
    );

    hud.style.display = 'none';
    touchControls.classList.remove('playing');
    screen.classList.remove('hidden');

    const isLast =
      game.levelIndex === levelBuilders.length - 1;

    screen.innerHTML = `
      <div class="panel">
        <h2>${isLast ? 'Headwaters Restored' : 'River Reach Restored'}</h2>

        <p>
          <strong>${game.level.name}</strong>
          finished at ${Math.round(game.health)}%
          ecosystem health.
        </p>

        <p>
          Salmon population boost:
          <strong>+${game.eggs}</strong>
          egg${game.eggs === 1 ? '' : 's'}.
        </p>

        <p>Score: <strong>${game.score}</strong></p>

        <button id="nextBtn">
          ${isLast ? 'See Final River' : 'Continue Upstream'}
        </button>
      </div>
    `;

    document.getElementById('nextBtn').addEventListener(
      'click',
      () => {
        if (isLast) {
          showVictory();
        } else {
          loadLevel(game.levelIndex + 1);
        }
      }
    );
  }

  function showVictory() {
    game.state = 'victory';
    screen.classList.remove('hidden');

    screen.innerHTML = `
      <div class="panel">
        <h1>River <span>Restored!</span></h1>

        <p>
          You restored the estuary,
          forest stream, and mountain
          headwaters.
        </p>

        <div class="legend">
          <span class="tag">Final score: ${game.score}</span>
          <span class="tag">Salmon eggs restored: ${game.totalEggs}</span>
          <span class="tag">Levels completed: 3</span>
        </div>

        <button id="playAgainBtn">Play Again</button>
      </div>
    `;

    document.getElementById('playAgainBtn').addEventListener('click', startGame);
  }

  function resolvePlatforms(prevY) {
    player.grounded = false;

    const prevBottom = prevY + player.h;
    const newBottom = player.y + player.h;

    for (const p of game.level.platforms) {
      const horizontal =
        player.x + player.w > p.x &&
        player.x < p.x + p.w;

      if (!horizontal) continue;

      if (
        player.vy >= 0 &&
        prevBottom <= p.y + 2 &&
        newBottom >= p.y
      ) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  function updateRespawnPoint() {
    if (!player.grounded || player.invuln > 0) return;

    const nearRunoff =
      game.level.runoff.some(
        r =>
          Math.abs(
            (r.x + r.w / 2) -
            (player.x + player.w / 2)
          ) < 120
      );

    if (!nearRunoff && frame % 30 === 0) {
      game.respawnX = player.x;
      game.respawnY = player.y - 2;
    }
  }

  function collectThings(prevY) {
    const pbox = {
      x: player.x,
      y: player.y,
      w: player.w,
      h: player.h
    };

    for (const seed of game.level.seeds) {
      if (!seed.active) continue;

      const box = {
        x: seed.x - 11,
        y: seed.y - 11,
        w: 22,
        h: 22
      };

      if (rectsOverlap(pbox, box)) {
        seed.active = false;
        game.seeds++;
        addScore(20);
        addHealth(2.2);
      }
    }

    for (const egg of game.level.eggs) {
      if (!egg.active) continue;

      const box = {
        x: egg.x - 14,
        y: egg.y - 14,
        w: 28,
        h: 28
      };

      if (rectsOverlap(pbox, box)) {
        egg.active = false;
        game.eggs++;
        addScore(175);
        addHealth(10);
        showToast('Salmon egg rescued!');
      }
    }

    for (const item of game.level.litter) {
      if (!item.active) continue;

      const box = {
        x: item.x - 12,
        y: item.y - 18,
        w: 30,
        h: 28
      };

      if (rectsOverlap(pbox, box)) {
        item.active = false;
        addScore(70);
        addHealth(6);
      }
    }

    for (const plant of game.level.plants) {
      if (!plant.active) continue;

      const box = {
        x: plant.x,
        y: plant.y,
        w: plant.w,
        h: plant.h
      };

      if (!rectsOverlap(pbox, box)) continue;

      const prevBottom = prevY + player.h;

      const stomping =
        player.vy > 1 &&
        prevBottom <= plant.y + 12;

      if (stomping) {
        plant.active = false;
        player.y = plant.y - player.h;
        player.vy = -7.5;
        addScore(100);
        addHealth(7);
      } else {
        damagePlayer();
      }
    }

    for (const r of game.level.runoff) {
      if (rectsOverlap(pbox, r)) {
        damagePlayer();
        break;
      }
    }
  }

  function update() {
    frame++;

    if (toastTimer > 0) {
      toastTimer--;

      if (toastTimer === 0) {
        toastEl.classList.remove('show');
      }
    }

    if (game.state !== 'playing') return;

    if (player.invuln > 0) player.invuln--;
    if (jumpBuffer > 0) jumpBuffer--;

    if (player.grounded) {
      coyote = 7;
    } else if (coyote > 0) {
      coyote--;
    }

    const axis =
      (keys.right ? 1 : 0) -
      (keys.left ? 1 : 0);

    if (axis !== 0) {
      player.vx += axis * .72;
      player.facing = axis;
    } else {
      player.vx *= player.grounded ? .78 : .94;
    }

    player.vx = clamp(player.vx, -6.2, 6.2);

    if (jumpBuffer > 0 && coyote > 0) {
      player.vy = -13.4;
      player.grounded = false;
      coyote = 0;
      jumpBuffer = 0;
    }

    for (const plant of game.level.plants) {
      if (!plant.active) continue;

      plant.x +=
        plant.dir *
        (game.levelIndex === 2 ? 1.1 : .75);

      if (
        plant.x <= plant.minX ||
        plant.x >= plant.maxX
      ) {
        plant.dir *= -1;
      }
    }

    const prevY = player.y;

    player.x += player.vx;
    player.x = clamp(
      player.x,
      0,
      game.level.width - player.w
    );

    player.vy += .68;
    player.vy = Math.min(player.vy, 16);
    player.y += player.vy;

    resolvePlatforms(prevY);
    collectThings(prevY);
    updateRespawnPoint();

    if (player.y > H + 120) {
      damagePlayer();
    }

    const desiredCamera =
      player.x -
      W * .34;

    game.cameraX =
      lerp(
        game.cameraX,
        clamp(
          desiredCamera,
          0,
          game.level.width - W
        ),
        .12
      );

    if (
      player.x +
      player.w >=
      game.level.exitX
    ) {
      if (game.health >= 80) {
        completeLevel();
      } else if (frame % 90 === 0) {
        showToast(
          `Restore to 80% — currently ${Math.round(game.health)}%`
        );
      }
    }
  }

  function mixColor(a, b, t) {
    const pa =
      a.match(/\w\w/g)
       .map(v => parseInt(v, 16));

    const pb =
      b.match(/\w\w/g)
       .map(v => parseInt(v, 16));

    const rgb =
      pa.map(
        (v, i) =>
          Math.round(
            lerp(
              v,
              pb[i],
              t
            )
          )
          .toString(16)
          .padStart(2, '0')
      );

    return `#${rgb.join('')}`;
  }

  function drawBackground() {
    const t =
      clamp(
        game.health / 100,
        0,
        1
      );

    let skyTop = '#a9c7c9';
    let skyBottom = '#d8ddd0';
    let ridgeFar = '#7e9486';
    let ridgeNear = '#5f7d69';

    if (game.level.theme === 'forest') {
      skyTop = '#9dbdc0';
      skyBottom = '#d3ded0';
      ridgeFar = '#6f8b78';
      ridgeNear = '#496d56';
    }

    if (game.level.theme === 'mountain') {
      skyTop = '#a9c7d8';
      skyBottom = '#e0e6da';
      ridgeFar = '#87949a';
      ridgeNear = '#687b75';
    }

    const grad =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );

    grad.addColorStop(
      0,
      mixColor(
        skyTop,
        '#8fd0e1',
        t * .55
      )
    );

    grad.addColorStop(
      1,
      mixColor(
        skyBottom,
        '#dcebd0',
        t * .45
      )
    );

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle =
      'rgba(255,255,235,.75)';

    ctx.beginPath();
    ctx.arc(790, 88, 34, 0, Math.PI * 2);
    ctx.fill();

    const farShift =
      (game.cameraX * .12) % 700;

    ctx.fillStyle = ridgeFar;

    for (
      let x = -750 - farShift;
      x < W + 800;
      x += 700
    ) {
      ctx.beginPath();
      ctx.moveTo(x, 330);
      ctx.lineTo(x + 170, 150);
      ctx.lineTo(x + 340, 330);
      ctx.lineTo(x + 500, 190);
      ctx.lineTo(x + 700, 330);
      ctx.closePath();
      ctx.fill();
    }

    const nearShift =
      (game.cameraX * .22) % 520;

    ctx.fillStyle = ridgeNear;

    for (
      let x = -560 - nearShift;
      x < W + 600;
      x += 520
    ) {
      ctx.beginPath();
      ctx.moveTo(x, 385);
      ctx.lineTo(x + 120, 235);
      ctx.lineTo(x + 230, 385);
      ctx.lineTo(x + 360, 250);
      ctx.lineTo(x + 520, 385);
      ctx.closePath();
      ctx.fill();
    }

    if (game.level.theme === 'forest') {
      drawTreeLine(t);
    }

    if (game.level.theme === 'estuary') {
      drawMarshLine(t);
    }

    if (game.level.theme === 'mountain') {
      drawRockLine(t);
    }

    const murky = '#718a7a';
    const clear = '#4e9eb6';

    ctx.fillStyle =
      mixColor(
        murky,
        clear,
        t
      );

    ctx.fillRect(0, 486, W, 54);

    ctx.strokeStyle =
      'rgba(255,255,255,.28)';

    ctx.lineWidth = 2;

    for (let y = 500; y < 540; y += 12) {
      ctx.beginPath();

      for (let x = 0; x <= W; x += 30) {
        const yy =
          y +
          Math.sin(
            (
              x +
              frame * 1.5
            ) *
            .03
          ) * 2;

        if (x === 0) {
          ctx.moveTo(x, yy);
        } else {
          ctx.lineTo(x, yy);
        }
      }

      ctx.stroke();
    }

    if (
      game.eggs > 0 ||
      game.health > 55
    ) {
      drawBackgroundSalmon();
    }
  }

  function drawTreeLine(t) {
    const shift =
      (game.cameraX * .35) % 170;

    const count =
      8 +
      Math.floor(t * 3);

    for (
      let i = -2;
      i < count;
      i++
    ) {
      const x =
        i * 150 -
        shift;

      const y = 400;

      ctx.fillStyle = '#405f45';
      ctx.fillRect(x + 26, y - 90, 12, 90);

      ctx.fillStyle =
        mixColor(
          '#526c4d',
          '#3f7a4d',
          t
        );

      ctx.beginPath();
      ctx.arc(x + 32, y - 105, 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x + 8, y - 85, 31, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x + 55, y - 82, 30, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMarshLine(t) {
    const shift =
      (game.cameraX * .3) % 90;

    ctx.strokeStyle =
      mixColor(
        '#778564',
        '#4e8555',
        t
      );

    ctx.lineWidth = 4;

    for (
      let x = -40 - shift;
      x < W + 50;
      x += 28
    ) {
      const h =
        30 +
        ((x * 13) % 24);

      ctx.beginPath();
      ctx.moveTo(x, 458);
      ctx.lineTo(x + 4, 458 - h);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + 7, 458);
      ctx.lineTo(x + 12, 462 - h * .75);
      ctx.stroke();
    }
  }

  function drawRockLine(t) {
    const shift =
      (game.cameraX * .3) % 180;

    ctx.fillStyle =
      mixColor(
        '#7c817a',
        '#6d8174',
        t
      );

    for (
      let x = -180 - shift;
      x < W + 180;
      x += 170
    ) {
      ctx.beginPath();
      ctx.moveTo(x, 455);
      ctx.lineTo(x + 38, 420);
      ctx.lineTo(x + 85, 435);
      ctx.lineTo(x + 118, 405);
      ctx.lineTo(x + 160, 455);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBackgroundSalmon() {
    const count =
      Math.min(
        5,
        game.eggs +
        Math.floor(
          game.health / 30
        )
      );

    for (let i = 0; i < count; i++) {
      const x =
        (
          (
            i * 230 +
            frame *
            (.7 + i * .08)
          ) %
          (W + 160)
        ) -
        80;

      const y =
        505 +
        (i % 3) * 10;

      ctx.fillStyle =
        'rgba(222,126,92,.65)';

      ctx.beginPath();
      ctx.ellipse(x, y, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x - 14, y);
      ctx.lineTo(x - 25, y - 7);
      ctx.lineTo(x - 25, y + 7);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPlatform(p) {
    const x =
      p.x -
      game.cameraX;

    if (
      x > W + 50 ||
      x + p.w < -50
    ) {
      return;
    }

    const t =
      clamp(
        game.health / 100,
        0,
        1
      );

    ctx.fillStyle =
      game.level.theme === 'mountain'
        ? '#6f736d'
        : '#756a50';

    ctx.fillRect(x, p.y, p.w, p.h);

    ctx.fillStyle =
      mixColor(
        '#8a805b',
        '#5d8b52',
        t
      );

    ctx.fillRect(x, p.y, p.w, 11);

    ctx.fillStyle =
      'rgba(255,255,255,.08)';

    for (
      let xx = x + 8;
      xx < x + p.w;
      xx += 38
    ) {
      ctx.fillRect(xx, p.y + 22, 18, 3);
    }

    if (
      t > .55 &&
      p.w > 150
    ) {
      ctx.fillStyle = '#f0d66b';

      for (
        let xx = x + 30;
        xx < x + p.w - 15;
        xx += 90
      ) {
        ctx.beginPath();
        ctx.arc(xx, p.y - 5, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawSeed(seed) {
    if (!seed.active) return;

    const x =
      seed.x -
      game.cameraX;

    if (
      x < -30 ||
      x > W + 30
    ) {
      return;
    }

    const bob =
      Math.sin(
        (
          frame +
          seed.x
        ) *
        .06
      ) * 3;

    ctx.save();
    ctx.translate(x, seed.y + bob);

    ctx.fillStyle =
      'rgba(248,232,146,.26)';

    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#7e5a39';

    ctx.beginPath();
    ctx.ellipse(-2, 3, 6, 4, -.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#4d8b4f';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(1, 1);
    ctx.quadraticCurveTo(6, -7, 10, -9);
    ctx.stroke();

    ctx.fillStyle = '#63a65d';

    ctx.beginPath();
    ctx.ellipse(9, -10, 5, 3, -.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawEgg(egg) {
    if (!egg.active) return;

    const x =
      egg.x -
      game.cameraX;

    if (
      x < -40 ||
      x > W + 40
    ) {
      return;
    }

    const bob =
      Math.sin(
        (
          frame +
          egg.x
        ) *
        .05
      ) * 4;

    ctx.save();
    ctx.translate(x, egg.y + bob);

    ctx.fillStyle =
      'rgba(255,196,134,.22)';

    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();

    const g =
      ctx.createRadialGradient(
        -4,
        -5,
        2,
        0,
        0,
        12
      );

    g.addColorStop(0, '#ffd7a0');
    g.addColorStop(1, '#dd7f62');

    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6b4b40';

    ctx.beginPath();
    ctx.arc(2, 1, 2.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawLitter(item) {
    if (!item.active) return;

    const x =
      item.x -
      game.cameraX;

    if (
      x < -40 ||
      x > W + 40
    ) {
      return;
    }

    ctx.save();
    ctx.translate(x, item.y);

    if (item.kind === 'bottle') {
      ctx.rotate(-.28);

      ctx.fillStyle = '#6ca1a9';
      ctx.fillRect(-6, -16, 12, 20);

      ctx.fillStyle = '#55777e';
      ctx.fillRect(-3, -21, 6, 6);

      ctx.fillStyle = '#dfe9e4';
      ctx.fillRect(-5, -7, 10, 5);

    } else if (item.kind === 'can') {
      ctx.rotate(.18);

      ctx.fillStyle = '#b6b7ac';
      ctx.fillRect(-8, -15, 16, 19);

      ctx.fillStyle = '#d17b61';
      ctx.fillRect(-8, -8, 16, 6);

    } else {
      ctx.fillStyle =
        'rgba(225,235,228,.82)';

      ctx.beginPath();
      ctx.moveTo(-11, 3);
      ctx.lineTo(-8, -14);
      ctx.lineTo(7, -17);
      ctx.lineTo(12, 2);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#a4b3aa';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawPlant(plant) {
    if (!plant.active) return;

    const x =
      plant.x -
      game.cameraX;

    if (
      x < -60 ||
      x > W + 60
    ) {
      return;
    }

    ctx.save();

    ctx.translate(
      x +
      plant.w / 2,
      plant.y +
      plant.h
    );

    ctx.strokeStyle = '#5b6f42';
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-2, -43);
    ctx.stroke();

    ctx.fillStyle = '#788d46';

    for (let i = 0; i < 4; i++) {
      const yy =
        -12 -
        i * 10;

      ctx.beginPath();
      ctx.ellipse(-10, yy, 11, 5, -.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(9, yy - 4, 10, 5, .35, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#c98a8a';

    ctx.beginPath();
    ctx.arc(-4, -47, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(4, -45, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawRunoff(r) {
    const x =
      r.x -
      game.cameraX;

    if (
      x < -120 ||
      x > W + 120
    ) {
      return;
    }

    ctx.fillStyle = '#6b6a49';

    ctx.beginPath();
    ctx.ellipse(
      x +
      r.w / 2,
      r.y +
      r.h / 2,
      r.w / 2,
      r.h / 2,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle =
      'rgba(126,114,64,.6)';

    for (let i = 0; i < 4; i++) {
      const bx =
        x +
        15 +
        (
          (
            i * 27 +
            frame * .35
          ) %
          Math.max(
            25,
            r.w - 30
          )
        );

      const by =
        r.y +
        4 +
        Math.sin(
          frame * .05 +
          i
        ) * 3;

      ctx.beginPath();
      ctx.arc(
        bx,
        by,
        3 + (i % 2),
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
  }

  function drawExit() {
    const x =
      game.level.exitX -
      game.cameraX;

    if (
      x < -120 ||
      x > W + 120
    ) {
      return;
    }

    const ready =
      game.health >= 80;

    ctx.save();
    ctx.translate(x, 0);

    ctx.strokeStyle = '#6f5b43';
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(0, 465);
    ctx.lineTo(0, 335);
    ctx.stroke();

    ctx.fillStyle =
      ready
        ? '#4f8f58'
        : '#9b8866';

    ctx.beginPath();
    ctx.moveTo(4, 340);
    ctx.lineTo(82, 360);
    ctx.lineTo(4, 385);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff8e7';
    ctx.font = '900 18px Trebuchet MS';

    ctx.fillText(
      ready
        ? 'RESTORE'
        : '80%',
      12,
      367
    );

    ctx.restore();
  }

  function drawPlayer() {
    const x =
      player.x -
      game.cameraX;

    const y =
      player.y;

    if (
      player.invuln > 0 &&
      Math.floor(
        player.invuln / 5
      ) % 2 === 0
    ) {
      return;
    }

    ctx.save();

    ctx.translate(
      x +
      player.w / 2,
      y +
      player.h / 2
    );

    ctx.scale(
      player.facing,
      1
    );

    ctx.fillStyle = '#82664c';
    ctx.fillRect(-17, -4, 10, 22);

    ctx.fillStyle = '#315f73';
    ctx.fillRect(-10, 12, 7, 13);
    ctx.fillRect(3, 12, 7, 13);

    ctx.fillStyle = '#5a4c3d';
    ctx.fillRect(-11, 23, 9, 4);
    ctx.fillRect(2, 23, 9, 4);

    ctx.fillStyle = '#3e8063';
    ctx.fillRect(-12, -7, 24, 22);

    ctx.fillStyle = '#d8c45c';
    ctx.fillRect(-2, -7, 4, 22);

    ctx.strokeStyle = '#8f5e42';
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-16, 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(10, -2);
    ctx.lineTo(16, 8);
    ctx.stroke();

    ctx.fillStyle = '#a36d4b';

    ctx.beginPath();
    ctx.arc(0, -18, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3a2e28';

    ctx.beginPath();
    ctx.arc(-2, -22, 9, Math.PI, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(-10, -23, 5, 9);

    ctx.fillStyle = '#4a7891';
    ctx.fillRect(-9, -28, 18, 5);
    ctx.fillRect(5, -25, 8, 3);

    ctx.restore();
  }

  function drawWorld() {
    if (!game.level) return;

    drawBackground();

    for (const p of game.level.platforms) {
      drawPlatform(p);
    }

    for (const r of game.level.runoff) {
      drawRunoff(r);
    }

    for (const item of game.level.litter) {
      drawLitter(item);
    }

    for (const seed of game.level.seeds) {
      drawSeed(seed);
    }

    for (const egg of game.level.eggs) {
      drawEgg(egg);
    }

    for (const plant of game.level.plants) {
      drawPlant(plant);
    }

    drawExit();
    drawPlayer();
  }

  function render() {
    if (!game.level) {
      ctx.fillStyle = '#b9dfe7';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#6b9272';

      ctx.beginPath();
      ctx.moveTo(0, 420);
      ctx.lineTo(180, 230);
      ctx.lineTo(350, 420);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#547660';

      ctx.beginPath();
      ctx.moveTo(240, 430);
      ctx.lineTo(500, 170);
      ctx.lineTo(750, 430);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#4e9eb6';
      ctx.fillRect(0, 455, W, 85);

      return;
    }

    drawWorld();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  showTitle();
  loop();
})();
</script>

</body>
</html>
